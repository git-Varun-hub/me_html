<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Room Booking Form</title>
  </head>

  <body>
    <center>
      <fieldset style="width: 480px; border: 2px solid black">
        <header style="text-align: center">
          <h1>Hotel Room Booking Form</h1>
        </header>

        <form action="">
          <div>
            <label for="name">Full Name:</label>
            <input type="text" id="name" required />
          </div>
          <br />

          <div>
            <label for="email">Email:</label>
            <input type="email" id="email" required />
          </div>
          <br />

          <div>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" required />
          </div>
          <br />

          <div>
            <label for="checkin">Check-in Date:</label>
            <input type="date" id="checkin" required />
          </div>
          <br />

          <div>
            <label for="checkout">Check-out Date:</label>
            <input type="date" id="checkout" required />
          </div>
          <br />

          <div>
            <label for="room">Room Type:</label>
            <select id="room" required>
              <option value="single room">Single Room</option>
              <option value="double room">Double Room</option>
            </select>
          </div>
          <br />

          <div>
            <label for="guest">Number of Guests:</label>
            <input type="number" id="guest" min="1" required />
          </div>
          <br />

          <div>
            <label for="comment">Special Requests:</label>
          </div>

          <div>
            <textarea id="comment" cols="35" rows="3"></textarea>
          </div>
          <br />

          <div>
            <button type="submit">Book Now</button>
            <button type="reset">Reset Form</button>
          </div>
          <br />
        </form>
      </fieldset>
    </center>
  </body>
</html>
